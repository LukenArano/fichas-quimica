<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="theme-color" content="#0E6C76"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Equilibrio"><title>Equilibrio químico · Fichas de Química</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estudio.css">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<div class="app" id="app"></div>
<script src="estudio.js"></script>
<script src="eq-data.js"></script>
<script>
const E=Estudio, $=E.$, U=EQ.UNITS, RX=EQ.RX;
const store=E.makeStore('estudio-eq-v1',{prog:{},decks:null,tab:'ruta',units:{},open:false});
const SHORT=['Idea','Kc','Kp','Q','Le Châtelier','ICE','Disoluciones'];
const plain=s=>s.replace(/<[^>]+>/g,'');
const done=id=>!!(store.st.units[id]&&store.st.units[id].done);
const unlocked=i=>store.st.open||i===0||done(U[i-1].id);

/* ---- fichas de repaso: salen de las unidades abiertas ---- */
const cards=[];
U.forEach(u=>u.cards.forEach((c,i)=>cards.push({key:u.id+'-'+i,deck:u.id,chip:['U'+u.n,'eq'],fchip:['U'+u.n,'eq'],
  front:`<div style="font-family:var(--font-display);font-size:clamp(22px,4.4vw,32px);font-weight:500;line-height:1.3;text-wrap:balance">${E.rich(c[0])}</div>`,
  back:`<div class="backtop"><div class="namebig" style="font-size:clamp(18px,3.4vw,24px)">${E.rich(c[0])}</div></div><div class="lesson" style="font-size:17px">${E.rich(c[1])}</div>`})));
const flash=E.flash({store,cards,decks:U.map((u,i)=>({k:u.id,n:'U'+u.n+' · '+SHORT[i]})),avail:id=>unlocked(U.findIndex(u=>u.id===id))});

/* ---- prácticas por unidad ---- */
const quizzes={};
function quizFor(u,i){
  return quizzes[u.id]||(quizzes[u.id]=E.quiz({title:'Práctica · unidad '+u.n,build:u.quiz,
    onFinish:r=>{ const s=store.st.units[u.id]||{best:0,tries:0}; s.tries++; s.best=Math.max(s.best,r.pct); if(r.pct>=70) s.done=true; store.st.units[u.id]=s; store.save(); },
    extra:r=>{ const nxt=U[i+1];
      return r.pct>=70
        ? `<div class="callout" style="--cc:var(--ok)"><b class="t">Unidad superada</b>${nxt?`Ya tienes abierta la unidad ${nxt.n}.`:'Has completado la ruta. Repasa con las fichas y practica en el laboratorio.'}</div><div class="row">${nxt?`<button class="primary" data-a="eq:go" data-v="${nxt.id}">Ir a la unidad ${nxt.n} →</button>`:''}<button class="ghost" data-a="eq:ruta">Volver a la ruta</button></div>`
        : `<div class="callout" style="--cc:var(--warn)"><b class="t">Aún no</b>Necesitas un 70 % para pasar. Relee la lección y vuelve a intentarlo: cada tanda genera preguntas nuevas.</div><div class="row"><button class="ghost" data-a="eq:step" data-v="leccion">Repasar la lección</button></div>`; }}));
}

const TABS=[['ruta','Ruta'],['repaso','Fichas'],['lab','Laboratorio'],['resumen','Resumen']];
let tab=store.st.tab||'ruta', view={uid:null,step:'leccion'};
if(/^#(ruta|repaso|lab|resumen)$/.test(location.hash)) tab=location.hash.slice(1);

$('#app').innerHTML=E.header({tile:'K',sym:'⇌',title:'Equilibrio químico',sub:'Ruta guiada de 7 unidades',current:'eq'})+
  `<nav class="tabs" role="tablist" id="tabs">${TABS.map(([k,n])=>`<button role="tab" data-a="tab" data-v="${k}">${n}</button>`).join('')}</nav><main id="view"></main>`;

/* ---------------- RUTA ---------------- */
function renderRuta(){
  E.keys(null);
  const v=$('#view');
  if(view.uid){ return renderUnit(v); }
  const nd=U.filter(u=>done(u.id)).length, firstOpen=U.findIndex(u=>!done(u.id));
  v.innerHTML=`<div class="rules"><section class="panel"><h2>Tu ruta</h2>
    <p class="muted">Cada unidad se construye sobre la anterior: <b>lección</b> corta → <b>práctica</b> con preguntas nuevas cada vez. Con un 70 % se abre la siguiente y sus fichas pasan al repaso espaciado.</p>
    <div class="meter" aria-hidden="true"><i style="width:${nd/U.length*100}%;background:var(--ok)"></i></div>
    <span class="count">${nd} de ${U.length} unidades superadas</span></section>
    <div class="path">${U.map((u,i)=>{ const st=store.st.units[u.id], lk=!unlocked(i), dn=done(u.id);
      return `<button class="unit${dn?' done':''}${lk?' locked':''}" ${lk?'disabled':''} data-a="eq:go" data-v="${u.id}"><span class="num">${dn?'✓':u.n}</span>
        <span><h3>${u.title}</h3><p>${u.sub}${!lk&&!dn&&i===firstOpen?' <span class="pill">siguiente</span>':''}</p></span>
        <span class="score">${lk?'bloqueada':st?'mejor '+st.best+' %':'sin empezar'}</span></button>`; }).join('')}</div>
    ${store.st.open?'':'<div class="row"><button class="ghost" data-a="eq:open">Abrir todas las unidades</button></div>'}
    ${E.resetBlock()}</div>`;
}
function renderUnit(v){
  const i=U.findIndex(u=>u.id===view.uid), u=U[i];
  const head=`<div class="bar"><button class="ghost" data-a="eq:ruta" style="min-height:40px;padding:8px 14px">← Ruta</button><span class="count">Unidad ${u.n} de ${U.length}</span></div>
    <div class="seg steps-bar" role="group"><button data-a="eq:step" data-v="leccion" aria-pressed="${view.step==='leccion'}">1 · Lección</button><button data-a="eq:step" data-v="practica" aria-pressed="${view.step==='practica'}">2 · Práctica</button></div>`;
  if(view.step==='leccion'){
    v.innerHTML=`<div class="rules">${head}<section class="panel"><h2>${u.title}</h2><p class="muted">${u.sub}</p>${E.rich(u.lesson())}
      <div class="row"><button class="primary" data-a="eq:step" data-v="practica">Ir a la práctica →</button></div></section></div>`;
    E.keys(null); window.scrollTo(0,0);
  } else {
    const c=document.createElement('div'); v.innerHTML=`<div class="rules">${head}<div id="qhost"></div></div>`;
    quizFor(u,i).render($('#qhost'));
  }
}
E.act('eq:go',id=>{ if(!unlocked(U.findIndex(u=>u.id===id))) return; view={uid:id,step:'leccion'}; tab='ruta'; render(); window.scrollTo(0,0); });
E.act('eq:ruta',()=>{ view={uid:null,step:'leccion'}; render(); });
E.act('eq:step',s=>{ view.step=s; if(s==='practica'){ const u=U.find(x=>x.id===view.uid); /* tanda nueva si la anterior terminó */ } render(); window.scrollTo(0,0); });
E.act('eq:open',()=>{ store.st.open=true; store.save(); render(); });
E.wireReset(store,()=>location.reload());

/* ---------------- LABORATORIO ---------------- */
const LABS={
  haber:{rx:RX.haber,c:{N2:1,H2:3,NH3:0},K:0.6,ymax:4,name:'Síntesis de amoníaco'},
  so3:{rx:RX.so3,c:{SO2:2,O2:1,SO3:0},K:2,ymax:3,name:'Trióxido de azufre'},
  n2o4:{rx:RX.n2o4,c:{N2O4:1,NO2:0},K:1,ymax:2,name:'N₂O₄ ⇌ NO₂'},
  pcl5:{rx:RX.pcl5,c:{PCl5:1,PCl3:0,Cl2:0},K:0.5,ymax:1.8,name:'PCl₅'},
  hi:{rx:RX.hi,c:{H2:1,I2:1,HI:0},K:4,ymax:2.5,name:'H₂ + I₂ ⇌ 2HI'},
};
let lab=null, labKey=store.st.lab||'haber', labTimer=null;
const nus=rx=>[...rx.r.map(x=>[x[1],-x[0]]),...rx.p.map(x=>[x[1],x[0]])];
const Qof=(rx,c)=>nus(rx).reduce((q,[s,n])=>q*Math.pow(c[s],n),1);
function solve(rx,c,K){
  const nu=nus(rx); let lo=-Infinity,hi=Infinity;
  nu.forEach(([s,n])=>{ const b=-c[s]/n; if(n>0) lo=Math.max(lo,b); else hi=Math.min(hi,b); });
  if(!isFinite(lo)) lo=-1e9; if(!isFinite(hi)) hi=1e9;
  for(let k=0;k<200;k++){ const m=(lo+hi)/2; const fv=nu.reduce((a,[s,n])=>a+n*Math.log(Math.max(1e-300,c[s]+n*m)),0)-Math.log(K); if(fv>0) hi=m; else lo=m; }
  const xi=(lo+hi)/2, out={}; nu.forEach(([s,n])=>out[s]=Math.max(0,c[s]+n*xi)); return out;
}
function labInit(key){
  const d=LABS[key]; labKey=key; store.st.lab=key; store.save();
  const eq=solve(d.rx,d.c,d.K);
  lab={d,K:d.K,K0:d.K,c:eq,prev:Object.assign({},eq),log:['Sistema en equilibrio. Prueba una perturbación.'],msg:null};
}
const fm=x=>E.num(x,3);
function labRender(){
  const v=$('#view'); E.keys(null);
  if(!lab) labInit(labKey);
  const d=lab.d, rx=d.rx, sps=nus(rx).map(x=>x[0]);
  const isR=s=>rx.r.some(x=>x[1]===s);
  const heat=rx.dH>0?'endotérmica':'exotérmica';
  v.innerHTML=`<div class="rules"><section class="panel"><h2>Laboratorio de Le Châtelier</h2>
    <p class="muted">Perturba el equilibrio y observa cómo responde. La línea discontinua marca dónde estaba cada especie antes. Compara <b>Q</b> con <b>K</b> tras cada acción.</p>
    <div class="bar">${E.seg('lab:rx',labKey,Object.entries(LABS).map(([k,x])=>[k,x.name]))}</div>
    <div class="lab-eq">${E.rich(EQ.eqStr(rx))}</div>
    <p class="count" style="text-align:center">ΔH = ${String(rx.dH).replace('-','−')} kJ (${heat}) · ${EQ.dn(rx)===0?'mismos moles de gas en ambos lados':'Δn gas = '+EQ.dn(rx)}</p>
    <div class="bars" style="--n:${sps.length}">${sps.map(s=>`<div class="bar-col" style="--cb:var(--c-${isR(s)?'af':'bf'})"><div class="track"><div class="col" id="col-${s}"></div><div class="ghostline" id="gl-${s}"></div></div><div class="val" id="val-${s}">0</div></div>`).join('')}</div>
    <div class="bar-labels" style="--n:${sps.length}">${sps.map(s=>`<span>${E.chem(s)}</span>`).join('')}</div>
    <div class="qk"><div class="stat"><b id="qv">–</b><span>Q (ahora)</span></div><div class="stat"><b id="kv">–</b><span>K</span></div><div class="stat"><b id="sv" style="font-size:18px">–</b><span>Estado</span></div></div>
    <div class="why labmsg" id="labmsg"></div></section>
    <section class="panel"><h3 style="margin:0">Perturbaciones</h3><div class="pert">
      ${sps.map(s=>`<button data-a="lab:add" data-v="${s}">+ Añadir ${E.chem(s)}</button><button data-a="lab:rem" data-v="${s}">− Retirar ${E.chem(s)} (50 %)</button>`).join('')}
      <button data-a="lab:vol" data-v="0.5">Comprimir (V ÷ 2)</button><button data-a="lab:vol" data-v="2">Expandir (V × 2)</button>
      <button data-a="lab:T" data-v="1">Calentar</button><button data-a="lab:T" data-v="-1">Enfriar</button>
      <button data-a="lab:cat">Añadir catalizador</button><button data-a="lab:inert">Añadir gas inerte (V cte)</button>
      <button data-a="lab:reset" style="background:var(--surface)">↺ Reiniciar</button></div></section></div>`;
  paint(lab.c,true); setMsg(lab.msg||{h:'Equilibrio inicial',b:'Elige una perturbación abajo.'});
}
function paint(c,instant){
  const d=lab.d, rx=d.rx;
  nus(rx).forEach(([s])=>{ const col=$('#col-'+s); if(!col) return; col.style.height=Math.min(100,c[s]/d.ymax*100)+'%'; $('#val-'+s).innerHTML=fm(c[s]); const gl=$('#gl-'+s); gl.style.bottom=Math.min(100,lab.prev[s]/d.ymax*100)+'%'; });
  const q=Qof(rx,c), eq=Math.abs(q/lab.K-1)<0.005;
  $('#qv').innerHTML=fm(q); $('#kv').innerHTML=fm(lab.K);
  $('#sv').textContent=eq?'Equilibrio':q<lab.K?'Q < K → derecha':'Q > K → izquierda';
}
function setMsg(m){ $('#labmsg').innerHTML=`<div class="row1">${m.h}</div><div>${m.b}</div>`; }
let pendingEq=null;
function settle(){ if(labTimer){ clearTimeout(labTimer); labTimer=null; if(pendingEq){ lab.c=pendingEq; pendingEq=null; } } }
function perturb(label,mod,note){
  settle();
  const d=lab.d, rx=d.rx, before=Object.assign({},lab.c);
  lab.prev=Object.assign({},before);
  const c=Object.assign({},before); mod(c);
  const q=Qof(rx,c), eq=solve(rx,c,lab.K);
  paint(c); lab.c=c; pendingEq=eq;
  const dir=Math.abs(q/lab.K-1)<0.005?'N':q<lab.K?'R':'L';
  setMsg({h:label,b:`Justo después: Q = ${fm(q)} frente a K = ${fm(lab.K)} → ${dir==='N'?'<b>Q = K: no hay desplazamiento</b>.':dir==='R'?'<b>Q &lt; K</b>: el sistema avanza hacia la <b>derecha</b>.':'<b>Q &gt; K</b>: el sistema retrocede hacia la <b>izquierda</b>.'} ${note||''}`});
  labTimer=setTimeout(()=>{ labTimer=null; pendingEq=null; lab.c=eq; paint(eq);
    const ch=nus(rx).map(([s])=>[s,eq[s]-before[s]]);
    setMsg({h:label,b:`Nuevo equilibrio (Q = K = ${fm(lab.K)}). Respecto al equilibrio previo: ${ch.map(([s,dv])=>`${E.chem(s)} ${Math.abs(dv)<0.003?'≈ igual':dv>0?'<b style="color:var(--c-bf)">▲ sube</b>':'<b style="color:var(--c-af)">▼ baja</b>'}`).join(' · ')}. ${note||''}`});
  },1100);
}
E.act('lab:rx',k=>{ settle(); lab=null; labKey=k; labRender(); });
E.act('lab:reset',()=>{ settle(); lab=null; labRender(); });
E.act('lab:add',s=>perturb(`Añades ${E.chem(s)}`,c=>{ c[s]+=1; },'La K no cambia: solo cambian las concentraciones.'));
E.act('lab:rem',s=>perturb(`Retiras la mitad de ${E.chem(s)}`,c=>{ c[s]*=0.5; },'La K no cambia.'));
E.act('lab:vol',f=>{ f=+f; const n=EQ.dn(lab.d.rx);
  perturb(f<1?'Comprimes el recipiente (V ÷ 2)':'Expandes el recipiente (V × 2)',c=>{ Object.keys(c).forEach(s=>c[s]/=f); },
    n===0?'Hay los mismos moles de gas en ambos lados: Q no cambia y no hay desplazamiento.':`Al ${f<1?'comprimir':'expandir'} todas las concentraciones se multiplican por ${f<1?2:'½'}; Q cambia porque Δn gas = ${n}. K sigue igual.`); });
E.act('lab:T',s=>{ const up=+s>0, endo=lab.d.rx.dH>0; const fac=(up===endo)?3:1/3;
  settle();
  const before=Object.assign({},lab.c); lab.prev=Object.assign({},before);
  const oldK=lab.K; lab.K=oldK*fac;
  const q=Qof(lab.d.rx,before), eq=solve(lab.d.rx,before,lab.K);
  paint(before); lab.c=before; pendingEq=eq;
  setMsg({h:up?'Calientas el sistema':'Enfrías el sistema',b:`La temperatura <b>cambia K</b>: de ${fm(oldK)} a ${fm(lab.K)} (la reacción es ${endo?'endotérmica':'exotérmica'}). Ahora Q = ${fm(q)} ${q<lab.K?'&lt;':'&gt;'} K → se desplaza hacia la <b>${q<lab.K?'derecha':'izquierda'}</b>.`});
  labTimer=setTimeout(()=>{ labTimer=null; pendingEq=null; lab.c=eq; paint(eq); setMsg({h:up?'Calientas el sistema':'Enfrías el sistema',b:`Nuevo equilibrio con K = ${fm(lab.K)}. Es la única perturbación que cambia la constante.`}); },1100); });
E.act('lab:cat',()=>{ settle(); lab.prev=Object.assign({},lab.c); paint(lab.c); setMsg({h:'Añades un catalizador',b:'No pasa nada con la posición del equilibrio ni con K: acelera por igual la reacción directa y la inversa. Solo se llegaría antes.'}); });
E.act('lab:inert',()=>{ settle(); lab.prev=Object.assign({},lab.c); paint(lab.c); setMsg({h:'Añades un gas inerte a volumen constante',b:'Las concentraciones de reactivos y productos no cambian, así que Q sigue siendo igual a K: no hay desplazamiento.'}); });

/* ---------------- RESUMEN ---------------- */
function resumen(){
  E.keys(null);
  return E.rich(`<div class="rules">
  <section class="panel lesson"><h2>Fórmulas</h2><div class="tw"><table><tbody>
   <tr><td>Constante</td><td>K<sub>c</sub> = [C]<sup>c</sup>[D]<sup>d</sup>/([A]<sup>a</sup>[B]<sup>b</sup>) · sólidos y líquidos puros fuera</td></tr>
   <tr><td>Con presiones</td><td>K<sub>p</sub> = K<sub>c</sub>(RT)<sup>Δn</sup> · Δn = Σ gas productos − Σ gas reactivos · R = 0,082 · T en K</td></tr>
   <tr><td>Cociente</td><td>Q (misma fórmula, cualquier instante). <b>Q &lt; K → derecha · Q = K → equilibrio · Q &gt; K → izquierda</b></td></tr>
   <tr><td>Manipular K</td><td>Invertir: 1/K · Multiplicar por n: K<sup>n</sup> · Sumar: K<sub>1</sub>·K<sub>2</sub></td></tr>
   <tr><td>Solubilidad</td><td>K<sub>sp</sub> = producto de iones · Q &gt; K<sub>sp</sub> → precipita</td></tr>
   <tr><td>Ácidos/bases</td><td>K<sub>a</sub>·K<sub>b</sub> = K<sub>w</sub> = 1,0×10^-14</td></tr></tbody></table></div></section>
  <section class="panel lesson"><h2>Le Châtelier de un vistazo</h2><div class="tw"><table><thead><tr><th>Perturbación</th><th>Desplazamiento</th><th>¿Cambia K?</th></tr></thead><tbody>
   <tr><td>+ reactivo / − producto</td><td>Derecha</td><td>No</td></tr>
   <tr><td>+ producto / − reactivo</td><td>Izquierda</td><td>No</td></tr>
   <tr><td>↑ presión (↓ V)</td><td>Hacia menos moles de gas (Δn = 0: nada)</td><td>No</td></tr>
   <tr><td>↓ presión (↑ V)</td><td>Hacia más moles de gas</td><td>No</td></tr>
   <tr><td>↑ T</td><td>Endotérmica: derecha · Exotérmica: izquierda</td><td><b>Sí</b></td></tr>
   <tr><td>↓ T</td><td>Endotérmica: izquierda · Exotérmica: derecha</td><td><b>Sí</b></td></tr>
   <tr><td>Catalizador</td><td>Ninguno (llega antes)</td><td>No</td></tr>
   <tr><td>Gas inerte a V cte</td><td>Ninguno</td><td>No</td></tr>
   <tr><td>Añadir sólido puro</td><td>Ninguno</td><td>No</td></tr></tbody></table></div></section>
  <section class="panel lesson"><h2>Receta para un problema ICE</h2><ol><li>Ajusta la ecuación y escribe K.</li><li>Tabla I / C / E con x (reactivos −, productos +, por coeficientes).</li><li>Sustituye la fila E en K y resuelve x (cuadrática o aproximación &lt; 5 %).</li><li>Calcula concentraciones y comprueba con K.</li></ol></section></div>`);
}

/* ---------------- control ---------------- */
function render(){
  document.querySelectorAll('#tabs [data-v]').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===tab));
  const v=$('#view'); if(tab!=='lab'&&lab) settle();
  if(tab==='ruta') renderRuta();
  else if(tab==='repaso') flash.render(v);
  else if(tab==='lab') labRender();
  else v.innerHTML=resumen();
  const nd=U.filter(u=>done(u.id)).length;
  $('#subtitle').textContent=`${nd} de ${U.length} unidades superadas · ${cards.length} fichas`;
}
E.act('tab',v=>{ tab=v; store.st.tab=v; store.save(); if(v==='ruta') view={uid:null,step:'leccion'}; render(); });
render();
if('serviceWorker' in navigator && location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body></html>
