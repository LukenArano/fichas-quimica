<!doctype html><html lang="eu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="theme-color" content="#0E6C76"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kimika"><title>Kimika</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estudio.css">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<div class="app" id="app"></div>
<script src="estudio.js"></script>
<script src="kimika.js"></script>
<script>
/* temas con contenido disponible (se cargan para calcular el progreso) */
const READY=['oreka'];
(function(){ let n=READY.length; const go=()=>{ if(--n<=0) start(); }; if(!n) start(); READY.forEach(id=>{ const s=document.createElement('script'); s.src='t-'+id+'.js'; s.onload=go; s.onerror=go; document.body.appendChild(s); }); })();
function start(){
const E=Estudio, K=Kimika, L=E.L, b=E.b, $=E.$;
const hub=K.hub;
const FREQ={oinarriak:['base',b('transversal','zeharkakoa')],oreka:['hi','8/10'],azidobase:['hi','9/10'],hauspeatzea:['hi','10/10'],pilak:['hi','7/10'],elektrolisia:['mid','1/10'],lv:['mid','5/10']};
const PRIO={hi:b('prioridad alta','lehentasun handia'),mid:b('prioridad media','lehentasun ertaina'),base:b('base','oinarria')};
const PLAN=[
  [b('Fundamentos + equilibrio (U1-U3)','Oinarriak + oreka (U1-U3)'),['oinarriak','oreka']],
  [b('Equilibrio (U4-U6) + exámenes de equilibrio','Oreka (U4-U6) + oreka-azterketak'),['oreka']],
  [b('Ácido-base','Azido-basea'),['azidobase']],
  [b('Precipitación y mezclas combinadas','Hauspeatzea eta nahaste konbinatuak'),['hauspeatzea']],
  [b('Redox y pilas','Erredoxa eta pilak'),['pilak']],
  [b('Pilas con Kps/pH + electrólisis','Pilak Kps/pH-rekin + elektrolisia'),['pilak','elektrolisia']],
  [b('Equilibrio líquido-vapor','Likido-lurrun oreka'),['lv']],
  [b('Exámenes completos 2022-2025','Azterketa osoak 2022-2025'),['az']],
  [b('Simulacros + repaso de errores y fichas','Simulakroak + akatsen eta txartelen errepasoa'),['az']],
];
const TX={
  title:'Kimika', sub:b('Química · UPV/EHU · preparación del examen','Kimika · UPV/EHU · azterketa prestatzeko'),
  days:b('días','egun'), exam:b('Examen','Azterketa'), change:b('cambiar fecha','data aldatu'),
  route:b('Ruta de aprendizaje','Ikasketa-ibilbidea'), routeIntro:b('Sigue el orden: cada parada usa lo que aprendiste en la anterior. El anillo muestra las unidades superadas.','Jarraitu ordena: geltoki bakoitzak aurrekoan ikasitakoa erabiltzen du. Eraztunak gainditutako unitateak erakusten ditu.'),
  units:b('unidades','unitate'), ex:b('ejercicios','ariketa'), due:b('fichas pendientes','txartel egiteke'), soon:b('en preparación','prestatzen'), exams:b('en exámenes','azterketetan'),
  plan:b('Plan semanal hasta el examen','Asteko plana azterketara arte'), week:b('Semana','Astea'), now:b('esta semana','aste honetan'),
  today:b('Hoy','Gaur'), todayNext:b('Siguiente paso recomendado','Gomendatutako hurrengo urratsa'), allDone:b('¡Ruta completa! Pasa a la sala de exámenes.','Ibilbidea osatuta! Joan azterketa-gelara.'),
  tools:b('Herramientas','Tresnak'), az:b('Sala de exámenes','Azterketa-gela'), azSub:b('10 exámenes con resultados verificados, resoluciones paso a paso y simulacros','10 azterketa emaitza egiaztatuekin, urratsez urratseko ebazpenekin eta simulakroekin'),
  form:b('Formulación','Formulazioa'), formSub:b('127 compuestos con repaso espaciado','127 konposatu errepaso tartekatuarekin'),
  fix:b('Correcciones','Zuzenketak'), fixSub:b('Errores detectados en apuntes y soluciones','Apunteetan eta ebazpenetan aurkitutako akatsak'),
  lang:b('El examen es en euskera: cambia a EU cuando quieras repasar con la terminología del examen.','Azterketa euskaraz da: aldatu EU-ra azterketako terminologiarekin errepasatu nahi duzunean.'),
};
$('#app').innerHTML=`<div id="hdr"></div><main id="view" class="rules"></main>`;
function ring(p,col){ const r=22,c=2*Math.PI*r; return `<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" fill="var(--surface)" stroke="var(--line)" stroke-width="6"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 28 28)"/></svg>`; }
function render(){
  $('#hdr').innerHTML=`<header class="top"><div class="brand"><div class="tile" aria-hidden="true"><small>UPV</small>K</div><div><h1>${TX.title}</h1><p>${L(TX.sub)}</p></div></div>${E.langSwitch()}</header>`;
  const ex=new Date((hub.st.exam||K.EXAM_DEFAULT)+'T09:00:00'), now=new Date();
  const days=Math.max(0,Math.ceil((ex-now)/864e5));
  const start=new Date(ex); start.setDate(start.getDate()-7*PLAN.length);
  const wk=Math.floor((now-start)/(7*864e5));
  const prog=Object.fromEntries(K.TOPICS.map(t=>[t.id,K.progress(t.id)]));
  // siguiente paso
  let next=null;
  for(const t of K.TOPICS){ if(!READY.includes(t.id)) continue; const p=prog[t.id]; if(p.du<p.nu){ next=t; break; } }
  const fmtD=d=>d.toLocaleDateString(E.lang()==='eu'?'eu-ES':'es-ES',{day:'numeric',month:'short'});
  $('#view').innerHTML=`
  <section class="panel"><div class="hero"><div><h2 style="margin:0">${L(TX.today)}</h2>
      <p class="muted" style="margin:6px 0 0">${next?`${L(TX.todayNext)}: <a href="tema.html?t=${next.id}"><b>${L(next.title)}</b></a> · ${prog[next.id].du}/${prog[next.id].nu} ${L(TX.units)}`:L(TX.allDone)}</p>
      <p class="muted" style="margin:6px 0 0;font-size:14px">${L(TX.lang)}</p></div>
    <div class="countdown"><b>${days}</b><span>${L(TX.days)} · ${L(TX.exam)} ${fmtD(ex)}</span><br><label style="font-size:12px;color:var(--ink-3)">${L(TX.change)} <input type="date" id="exdate" value="${hub.st.exam}" style="font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)"></label></div></div></section>
  <section class="panel"><h2 style="margin:0">${L(TX.route)}</h2><p class="muted" style="margin:0">${L(TX.routeIntro)}</p>
   <div class="roadmap">${K.TOPICS.map(t=>{ const p=prog[t.id], ready=READY.includes(t.id), [pk,fq]=FREQ[t.id];
     const inner=`<span class="ring">${ring(ready?p.pct:0,`var(--c-${t.col})`)}</span><span class="card2" style="--cc:var(--c-${t.col})"><span class="meta"><span>${t.ref}</span><span class="prio ${pk}">${L(PRIO[pk])}</span><span>${L(fq)} ${pk!=='base'?L(TX.exams):''}</span></span>
       <h3>${L(t.title)}</h3><p>${L(t.sub)}</p>
       <span class="meta">${ready?`<span>${p.du}/${p.nu} ${L(TX.units)}</span><span>${p.dx}/${p.nx} ${L(TX.ex)}</span>${p.due?`<span style="color:var(--bad)">${p.due} ${L(TX.due)}</span>`:''}`:`<span>${L(TX.soon)}</span>`}</span></span>`;
     return ready?`<a class="stop" href="tema.html?t=${t.id}">${inner}</a>`:`<div class="stop" style="opacity:.6">${inner}</div>`; }).join('')}</div></section>
  <section class="panel"><h2 style="margin:0">${L(TX.tools)}</h2><div class="tiles">
    <a class="tilelink" href="azterketak.html" style="--cc:var(--c-exam)"><b>${L(TX.az)}</b><span>${L(TX.azSub)}</span></a>
    <a class="tilelink" href="azterketak.html#zuzenketak" style="--cc:var(--bad)"><b>${L(TX.fix)}</b><span>${L(TX.fixSub)}</span></a>
    <a class="tilelink" href="formulacion.html" style="--cc:var(--c-oinarri)"><b>${L(TX.form)}</b><span>${L(TX.formSub)}</span></a></div></section>
  <section class="panel"><h2 style="margin:0">${L(TX.plan)}</h2><div>${PLAN.map(([txt,ids],i)=>{ const d0=new Date(start); d0.setDate(d0.getDate()+7*i); const d1=new Date(d0); d1.setDate(d1.getDate()+6);
     return `<div class="week${i===wk?' now':''}"><span class="wd">${L(TX.week)} ${i+1} · ${fmtD(d0)}–${fmtD(d1)}${i===wk?' · '+L(TX.now):''}</span><span>${L(txt)}</span></div>`; }).join('')}</div></section>`;
  const inp=$('#exdate'); if(inp) inp.addEventListener('change',()=>{ if(inp.value){ hub.st.exam=inp.value; hub.save(); render(); } });
}
E.onLang(render);
render();
}
if('serviceWorker' in navigator && location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body></html>
